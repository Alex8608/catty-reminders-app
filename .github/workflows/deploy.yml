name: Deploy to VM

on:
  workflow_run:
    workflows: ["CI Tests and Docker Build"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy Docker container to VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: "course.prafdin.ru"
        username: "alex"
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2459
        script: |
          # Логинимся в GitHub Container Registry
          echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u alex8608 --password-stdin
          
          # Останавливаем и удаляем старый контейнер
          docker stop catty-app || true
          docker rm catty-app || true
          
          # Pull последнего образа
          docker pull ghcr.io/alex8608/catty-reminders-app:latest
          
          # Запускаем новый контейнер
          docker run -d \
            --name catty-app \
            --restart unless-stopped \
            -p 8181:8181 \
            ghcr.io/alex8608/catty-reminders-app:latest
          
          # Очищаем старые образы
          docker image prune -f
          
          echo "✅ Deployment completed! App available at: http://app.course.prafdin.ru"
